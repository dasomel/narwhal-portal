name: Unit Test Gate

# Runs the Vitest regression suite (468+ tests covering RBAC, cluster/team scope,
# event idempotency, and other security-critical paths) on every change to
# application source, so a broken suite blocks merge instead of only being
# discoverable by running it by hand.
#
# WHY THIS EXISTS: `pnpm test` (vitest run) was a defined script with a real,
# growing suite behind it, but no workflow ever invoked it — build-check.yml only
# type-checks and builds, and neither runs on src/** changes. A regression in
# authz/event logic could land on main with zero automated signal. See portal #18.

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "vitest.config.*"
      - "tsconfig.json"
      - ".github/workflows/test.yml"
  pull_request:
    paths:
      - "src/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "vitest.config.*"
      - "tsconfig.json"
      - ".github/workflows/test.yml"

# Read-only: this job inspects the checkout and produces no artifact.
permissions:
  contents: read

jobs:
  test:
    name: Typecheck and unit/API tests
    runs-on: ubuntu-latest
    steps:
      # Same allowlist rationale as build-check.yml: block egress before checkout so
      # a malicious install/build script cannot reach anything outside package
      # registries and GitHub itself.
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            registry.npmjs.org:443
            raw.githubusercontent.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # Version comes from package.json "packageManager", matching build-check.yml.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm typecheck

      - name: Unit / API tests
        run: pnpm test
