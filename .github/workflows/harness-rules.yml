name: harness-rules

# Enforce the countable CLAUDE.md "Critical Rules" (Tailwind-first styling, i18n
# for UI text). Both have pre-existing debt, so this is a ratchet against
# recorded baselines — see scripts/harness-rules.sh. It blocks NEW violations,
# not the existing ones.

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/harness-rules.sh"
      - ".github/workflows/harness-rules.yml"
  pull_request:
    paths:
      - "src/**"
      - "scripts/harness-rules.sh"

# Least privilege: this workflow only reads the checkout.
permissions:
  contents: read

jobs:
  ratchet:
    name: CLAUDE.md rule ratchet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check rule baselines
        run: bash scripts/harness-rules.sh
