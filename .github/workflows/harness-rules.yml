name: harness-rules

# Enforce the countable CLAUDE.md "Critical Rules" (Tailwind-first styling, i18n
# for UI text). Both have pre-existing debt, so this is a ratchet against
# recorded baselines — see scripts/harness-rules.sh. It blocks NEW violations,
# not the existing ones.
#
# It also runs the unit tests, because this is the workflow that already watches
# src/**. Build Check is filtered to dependency and build-config changes, so a
# pure src/** change ran no test at all — which was fine while there were none.
# src/lib/role-filter.ts now decides who may see which namespace, project, alert
# and cached result; that is not something to leave to review.

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/harness-rules.sh"
      - ".github/workflows/harness-rules.yml"
  pull_request:
    paths:
      - "src/**"
      - "scripts/harness-rules.sh"

# Least privilege: this workflow only reads the checkout.
permissions:
  contents: read

jobs:
  ratchet:
    name: CLAUDE.md rule ratchet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check rule baselines
        run: bash scripts/harness-rules.sh

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test
