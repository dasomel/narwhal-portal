name: Independent Review Gate

# Required status check `independent-review`: green only when the PR carries the
# `review:pass` label AND that label was applied after the PR's latest push, so a later
# push invalidates an earlier review. Semantics live in scripts/check-independent-review.mjs.
# Re-evaluated on every push and on label changes. Needs no dependencies, so no install.

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled, ready_for_review, converted_to_draft]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Read-only, which is all Dependabot's token gets as well.
permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  independent-review:
    name: independent-review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Check review:pass postdates the last push
        run: node scripts/check-independent-review.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
