name: Build Check

# Type-check and build whenever source, dependency, or build inputs change.
#
# WHY THIS EXISTS: every other workflow here is filtered to src/**, DESIGN.md or a
# v*.*.* tag, so a change to package.json or pnpm-lock.yaml ran NO checks at all. The
# Next.js 16.2.6 -> 16.3.0 bump (7fb1b16) went to main with nothing verifying it in CI;
# it was only known-good because it was built by hand first. The next one might not be,
# and Dependabot raises exactly this kind of PR.
#
# Also runs on source and build-input changes — a TypeScript/Next regression must not rely
# on a dependency change to receive the production-build gate. The unit-test workflow is
# not a substitute: it does not compile the route graph or standalone output.

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "next.config.ts"
      - "tsconfig.json"
      - "Dockerfile"
      - ".github/workflows/build-check.yml"
  pull_request:
    paths:
      - "src/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "next.config.ts"
      - "tsconfig.json"
      - "Dockerfile"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Read-only: this job inspects the checkout and produces no artifact.
permissions:
  contents: read

jobs:
  build:
    name: Type-check and build
    runs-on: ubuntu-latest
    steps:
      # Blocks egress before checkout so a malicious install/build script (transitive,
      # postinstall-equivalent, or otherwise) cannot reach anything outside this
      # allowlist. `pnpm install --frozen-lockfile` below only needs the npm registry
      # and GitHub itself; a real exfiltration attempt fails closed instead of quietly
      # succeeding. audit mode intentionally off: block is the point of this gate.
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            registry.npmjs.org:443
            raw.githubusercontent.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # Version comes from package.json "packageManager"; keep the runtime aligned with
      # the container base image (node:22-alpine) so CI cannot pass on a Node the
      # published image never runs.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      # --frozen-lockfile is the point, not a detail: it fails when package.json and
      # pnpm-lock.yaml disagree, which is the most common way a dependency change breaks.
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm typecheck

      # The published image runs the standalone output, so a build that succeeds without
      # producing it would still be broken at deploy time.
      - name: Build
        run: pnpm build

      - name: Assert standalone output exists
        run: |
          set -euo pipefail
          if [ ! -d .next/standalone ]; then
            echo "::error::.next/standalone missing — the Dockerfile copies it, so the image would not run"
            exit 1
          fi
          echo "standalone output present"

      # next/image is unused and sharp is excluded from tracing so the image does
      # not redistribute LGPL-licensed libvips (see NOTICE). Config alone does not
      # do it — `images.unoptimized` leaves sharp in the trace — so the exclusion
      # is asserted against the actual output rather than trusted.
      - name: Assert libvips is not in the output
        run: |
          set -euo pipefail
          found=$(find .next/standalone -ipath '*libvips*' -type f | head -5)
          if [ -n "$found" ]; then
            echo "::error::libvips (LGPL-3.0-or-later) is in the standalone output"
            echo "$found"
            exit 1
          fi
          echo "no libvips in output"

      # THIRD-PARTY-NOTICES.md excludes platform-gated native packages — @img/sharp-*,
      # @next/swc-* and friends — on the grounds that the build ships no native binary.
      # That is a claim about the output, so the output is what checks it. Without this,
      # a future change could start shipping one and the notices would silently omit it.
      - name: Assert no native binary ships
        run: |
          set -euo pipefail
          found=$(find .next/standalone -name '*.node' -type f | head -5)
          if [ -n "$found" ]; then
            echo "::error::a native binary is in the standalone output; THIRD-PARTY-NOTICES.md excludes platform-gated packages and would now be incomplete"
            echo "$found"
            exit 1
          fi
          echo "no native binaries in output"

  image:
    name: Container image builds
    runs-on: ubuntu-latest
    # WHY THIS EXISTS: docker-publish.yml only runs on a v*.*.* tag, so a broken
    # Dockerfile was first discovered at release time. The runner stage now copies
    # LICENSE, NOTICE and THIRD-PARTY-NOTICES.md, and .dockerignore excludes *.md
    # with a re-include for the last of those — exactly the kind of interaction
    # that fails silently in review and loudly during a release.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build (no push)
        run: docker build -t narwhal-portal:ci .

      - name: Assert the license files are in the image
        run: |
          set -euo pipefail
          for f in LICENSE NOTICE THIRD-PARTY-NOTICES.md; do
            docker run --rm --entrypoint sh narwhal-portal:ci -c "[ -s /app/$f ]" \
              || { echo "::error::/app/$f missing from the image"; exit 1; }
            echo "/app/$f present"
          done

      - name: Assert libvips is not in the image
        run: |
          set -euo pipefail
          hits=$(docker run --rm --entrypoint sh narwhal-portal:ci \
            -c "find / -ipath '*libvips*' -type f 2>/dev/null | head -5")
          if [ -n "$hits" ]; then
            echo "::error::libvips (LGPL-3.0-or-later) is present in the published image"
            echo "$hits"
            exit 1
          fi
          echo "no libvips in the image"
