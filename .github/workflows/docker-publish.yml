name: Build & Publish Container (GHCR)

# Builds the narwhal-portal container and publishes it to GitHub Container
# Registry (ghcr.io/dasomel/narwhal-portal).
#
# Tagging strategy (docker/metadata-action):
#   - push tag v1.2.3 (SemVer)-> :1.2.3, :1.2, :1, :latest
#   - manual (workflow_dispatch)
# Version source of truth = git tags (v-prefixed). On a release tag we also
# assert the tag matches package.json "version" so the two never drift.
#
# Builds ONLY on version tags (not on every main push): a release commit is
# pushed to main AND tagged, which previously fired two duplicate builds of the
# same commit. GitOps pins an immutable SemVer tag, so a release == a tag == one
# build. Use workflow_dispatch for ad-hoc builds.
#
# ARCH STRATEGY — one job per architecture, on a NATIVE runner:
# v1.0.16 never published because a single job built both platforms and the
# arm64 leg ran `next build` under QEMU emulation: amd64 finished in ~90s while
# arm64 was still compiling 5 minutes later (an earlier run reached 2h38m before
# being cancelled). Emulated Node/Next builds are pathologically slow, and the
# cost grows with the app. So each arch builds on its own native runner
# (`ubuntu-24.04-arm` is free for public repos), pushes by digest, and a final
# job merges the digests into one multi-arch manifest. No QEMU anywhere.

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

concurrency:
  group: ghcr-publish-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }} # ghcr.io/dasomel/narwhal-portal (lowercase)

# Default for any job that does not declare its own; the build and merge jobs below
# widen this deliberately for GHCR push and provenance.
permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write # push to GHCR via GITHUB_TOKEN
      id-token: write # provenance/attestation
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Slashes are illegal in artifact names — linux/amd64 -> linux-amd64.
      - name: Derive platform slug
        run: |
          set -euo pipefail
          platform='${{ matrix.platform }}'
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      # Guard: on a vX.Y.Z tag, the tag must match package.json version.
      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          pkg="$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF_NAME#v}"
          echo "package.json=$pkg  tag=$tag"
          if [ "$pkg" != "$tag" ]; then
            echo "::error::git tag v$tag does not match package.json version $pkg — bump package.json before tagging."
            exit 1
          fi

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Labels only here; the tags are applied by the merge job on the manifest
      # list. Tagging a per-arch image would make the tag point at one arch.
      - name: Derive labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          labels: |
            org.opencontainers.image.title=narwhal-portal
            org.opencontainers.image.description=Narwhal IDP management portal (Next.js)
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build & push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          # Scope the cache per arch — a shared scope makes the two jobs evict
          # each other's layers on every run.
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${RUNNER_TEMP}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: merge manifest & tag
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          set -euo pipefail
          # One file per arch, named after its digest (see "Export digest").
          count=$(find . -type f | wc -l)
          echo "merging ${count} per-arch digests"
          [ "$count" -ge 2 ] || { echo "::error::expected 2 digests, got ${count}"; exit 1; }
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${IMAGE}@sha256:%s " *)

      - name: Verify both architectures are present
        run: |
          set -euo pipefail
          ref="${IMAGE}:${{ steps.meta.outputs.version }}"
          docker buildx imagetools inspect "$ref"
          raw=$(docker buildx imagetools inspect --raw "$ref")
          for arch in amd64 arm64; do
            jq -e --arg a "$arch" \
              '.manifests[] | select(.platform.os == "linux" and .platform.architecture == $a)' \
              >/dev/null <<< "$raw" \
              || { echo "::error::${arch} missing from ${ref}"; exit 1; }
          done
